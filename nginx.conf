server {
    listen 80;
    server_name _;

    # Docker internal DNS resolver
    resolver 127.0.0.11 valid=30s;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html; 
    }

    # Accounts API
    location /api/accounts/ {
        set $upstream_accounts accounts-service;
        proxy_pass http://$upstream_accounts:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Products API
    location /api/products/ {
        set $upstream_catalog catalog-service;
        proxy_pass http://$upstream_catalog:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    
    # Cart API
    location /api/cart/ {
        set $upstream_catalog catalog-service;
        proxy_pass http://$upstream_catalog:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Orders API
    location /api/orders/ {
        set $upstream_orders orders-service;
        proxy_pass http://$upstream_orders:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Blog API proxying
    location /api/blogs {
        set $upstream_blogs blogs-service;
        proxy_pass http://$upstream_blogs:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/categories {
        set $upstream_blogs blogs-service;
        proxy_pass http://$upstream_blogs:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/tags {
        set $upstream_blogs blogs-service;
        proxy_pass http://$upstream_blogs:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Blog frontend routes (Vue.js SPA) - proxy to blogs-client container
    location /blogs/ {
        set $upstream_blogs_client blogs-client;
        proxy_pass http://$upstream_blogs_client:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Redirect /blogs to /blogs/ 
    location = /blogs {
        return 301 /blogs/;
    }
}
